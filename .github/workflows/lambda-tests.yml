name: Lambda Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test-enrichment:
    name: Enrichment Lambda — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r lambda/enrichment/requirements.txt pytest moto boto3
      - run: pytest lambda/enrichment/tests/ -v --tb=short

  test-alerting:
    name: Alerting Lambda — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r lambda/alerting/requirements.txt pytest moto boto3
      - run: pytest lambda/alerting/tests/ -v --tb=short
