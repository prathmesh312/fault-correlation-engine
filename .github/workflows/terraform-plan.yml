name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform plan — ${{ matrix.region }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        region: [ap-southeast-2, us-east-1, eu-central-1]

    defaults:
      run:
        working-directory: terraform/regions/${{ matrix.region }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -var-file="production.tfvars" \
            -out=tfplan \
            -no-color \
            2>&1 | tee plan_output.txt

      - name: Check for destructive changes
        run: |
          DESTROY_COUNT=$(terraform show -json tfplan | \
            jq '[.resource_changes[] | 
            select(.change.actions[] == "delete")] | length')
          
          if [ "$DESTROY_COUNT" -gt "0" ]; then
            echo "BLOCKED: Plan contains $DESTROY_COUNT destructive changes"
            echo "Resources to be destroyed:"
            terraform show -json tfplan | \
              jq -r '.resource_changes[] | 
              select(.change.actions[] == "delete") | 
              "  - \(.type).\(.name)"'
            echo ""
            echo "To override, add label 'allow-destroy' to this PR"
            exit 1
          fi
          echo "No destructive changes detected"

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: always()
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const region = '${{ matrix.region }}';
            const plan = process.env.PLAN || 'Plan output not available';
            const body = `### Terraform Plan — ${region}\n\`\`\`\n${plan}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
