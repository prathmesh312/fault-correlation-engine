name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: Plan — ${{ matrix.region }}
    runs-on: ubuntu-latest

    # Don't cancel other regions if one fails
    strategy:
      fail-fast: false
      matrix:
        region: [ap-southeast-2, us-east-1, eu-central-1]

    defaults:
      run:
        working-directory: terraform/regions/${{ matrix.region }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Terraform init
        id: init
        run: terraform init -backend=false

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -var-file="production.tfvars" \
            -no-color \
            2>&1 | tee plan_output.txt || true
          echo "plan_exit_code=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Check for destructive changes
        if: env.plan_exit_code == '0'
        run: |
          if grep -q "# .* will be destroyed" plan_output.txt; then
            echo "BLOCKED: Plan contains destructive changes:"
            grep "# .* will be destroyed" plan_output.txt
            exit 1
          fi
          echo "No destructive changes detected"

      - name: Validate IAM policies — no wildcards
        if: env.plan_exit_code == '0'
        run: |
          python3 -c "
          import subprocess, json, sys
          result = subprocess.run(
              ['terraform', 'show', '-json', 'plan_output.txt'],
              capture_output=True, text=True
          )
          # If no plan file, skip validation
          if result.returncode != 0:
              print('No plan file to validate — skipping IAM check')
              sys.exit(0)
          try:
              data = json.loads(result.stdout)
              for change in data.get('resource_changes', []):
                  if change.get('type') == 'aws_iam_role_policy':
                      policy = change.get('change', {}).get('after', {}).get('policy', '{}')
                      doc = json.loads(policy)
                      for stmt in doc.get('Statement', []):
                          actions = stmt.get('Action', [])
                          resources = stmt.get('Resource', [])
                          if isinstance(actions, str): actions = [actions]
                          if isinstance(resources, str): resources = [resources]
                          for a in actions:
                              if a.endswith(':*'):
                                  print(f'BLOCKED: Wildcard action: {a}')
                                  sys.exit(1)
                          for r in resources:
                              if r == '*':
                                  print('BLOCKED: Wildcard resource in IAM policy')
                                  sys.exit(1)
              print('IAM policy validation passed')
          except Exception as e:
              print(f'IAM validation skipped: {e}')
          " || true

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const region = '${{ matrix.region }}';
            let plan = '';
            try {
              plan = fs.readFileSync(
                'terraform/regions/' + region + '/plan_output.txt',
                'utf8'
              ).slice(0, 60000);
            } catch(e) {
              plan = 'Plan output not available — check workflow logs for errors.';
            }
            const status = '${{ env.plan_exit_code }}' === '0' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ${status} Terraform Plan — ${region}\n\`\`\`\n${plan}\n\`\`\``
            });
